<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ola Jin Myhre Nymoen</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #0d0d0d;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        nav {
            all: unset;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 28px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-sizing: border-box;
        }

        .room-name {
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }

        .room-projects {
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            text-decoration: none;
            transition: color 0.4s ease;
        }

        .room-projects:hover {
            color: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <nav>
        <a href="index.html" class="room-name" style="text-decoration:none; cursor:pointer;">Selected Works</a>
        <a href="projects/architecture/index.html" class="room-projects">Projects</a>
    </nav>

    <script src="particles.js"></script>

</body>
</html>
