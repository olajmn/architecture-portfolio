<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ola Jin Myhre Nymoen</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #0d0d0d;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        nav {
            all: unset;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 28px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-sizing: border-box;
        }

        .room-name {
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }

        .room-projects {
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            text-decoration: none;
            transition: color 0.4s ease;
        }

        .room-projects:hover {
            color: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <nav>
        <span class="room-name">Selected works 2021–2024</span>
        <a href="projects/architecture/index.html" class="room-projects">Projects</a>
    </nav>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx    = canvas.getContext('2d');

        // Gjør canvas like stor som vinduet
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // ── FARGEPALLETTE ──
        // Varme hvit/beige/amber-toner — som glødende tråder
        const colors = [
            'rgba(0,   200, 255, ',   // cyan neon
            'rgba(30,  120, 255, ',   // elektrisk blå
            'rgba(100, 180, 255, ',   // lys himmelblå
            'rgba(0,   80,  200, ',   // dyp blå
            'rgba(180, 240, 255, ',   // nesten hvit-blå
        ];

        // ── PARTIKLER ──
        const COUNT = 1200;
        const particles = [];

        for (let i = 0; i < COUNT; i++) {
            particles.push(spawnParticle());
        }

        function spawnParticle() {
            return {
                x:     Math.random() * canvas.width,
                y:     Math.random() * canvas.height,
                vx:    0,
                vy:    0,
                life:  Math.random(),                         // starter på tilfeldig punkt i livet
                speed: 1.0 + Math.random() * 2.5,
                size:  0.2 + Math.random() * 0.9,
                color: colors[Math.floor(Math.random() * colors.length)]
            };
        }

        // ── MUS-POSISJON ──
        const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // ── FLOW FIELD ──
        let time = 0;

        function getAngle(x, y) {
            const s = 0.0012;
            return (
                Math.sin(x * s       + time * 0.25) *
                Math.cos(y * s * 0.9 + time * 0.18) *
                Math.PI * 3.5
            );
        }

        // ── ANIMASJON ──
        function animate() {
            ctx.fillStyle = 'rgba(13, 13, 13, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                const angle = getAngle(p.x, p.y);

                // Regn ut retning mot musen
                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // Styrken på tiltrekning avtar med avstand
                // Maks påvirkning innenfor 350px, ingen utenfor
                const pull = Math.max(0, 1 - dist / 350) * 0.06;

                // Bland flow field-akselerasjon med svak tiltrekning mot mus
                p.vx += Math.cos(angle) * 0.22 + (dx / dist || 0) * pull;
                p.vy += Math.sin(angle) * 0.22 + (dy / dist || 0) * pull;

                // Begrens farten så partikler ikke flyr av gårde
                const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (spd > p.speed) {
                    p.vx = (p.vx / spd) * p.speed;
                    p.vy = (p.vy / spd) * p.speed;
                }

                const px = p.x;
                const py = p.y;
                p.x += p.vx;
                p.y += p.vy;

                // Partikkelen eldes
                p.life -= 0.0025;

                // Hvis den er "død" eller ute av skjermen — spawn ny
                if (p.life <= 0 || p.x < -10 || p.x > canvas.width + 10 ||
                                    p.y < -10 || p.y > canvas.height + 10) {
                    Object.assign(p, spawnParticle());
                    return;
                }

                // Tegn en linje fra forrige posisjon til ny posisjon
                const alpha = p.life * 0.65;
                ctx.strokeStyle = p.color + alpha + ')';
                ctx.lineWidth   = p.size;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            });

            time += 0.003;
            requestAnimationFrame(animate);  // kall animate igjen neste frame
        }

        animate();
    </script>

</body>
</html>
