<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ola Jin Myhre Nymoen</title>

  <link rel="stylesheet" href="css/main.css" />

  <script>
    (function () {
      history.scrollRestoration = 'manual';

      var scrollY = parseFloat(sessionStorage.getItem('scrollY'));
      if (scrollY > 0) document.documentElement.classList.add('restoring-scroll');

      var fromProject = sessionStorage.getItem('fromProject') === '1';
      var introSeen   = sessionStorage.getItem('introSeen')   === '1';
      if (fromProject) document.documentElement.classList.add('from-project');
      if (introSeen)   document.documentElement.classList.add('intro-seen');

      var tickerStart = sessionStorage.getItem('tickerStart');
      var tickerWidth = sessionStorage.getItem('tickerWidth');
      if (tickerStart && tickerWidth) {
        var elapsed = ((Date.now() - tickerStart) / 1000) % 50;
        document.documentElement.style.setProperty('--ticker-delay', '-' + elapsed + 's');
        document.documentElement.style.setProperty('--ticker-end', '-' + tickerWidth + 'px');
      }
    }());
  </script>
</head>

<body data-page="index">

  <!-- ================= HEADER ================= -->
  <header class="index-hero">
    <button class="index-logo-btn" aria-label="Logo button">
      <img src="images/architecture-portfolio.svg" class="index-logo" alt="Logo" />
    </button>
  </header>

  <!-- ================= TICKER ================= -->
  <div class="ticker">
    <div class="ticker-track">
      <span>Selected Works</span>
      <span>Selected Works</span>
    </div>
  </div>

  <!-- ================= GRID ================= -->
  <main class="index-projects" id="projectsGrid">
    <!-- JS generates cards here -->
  </main>


  <!-- ================= JS ================= -->
  <script type="module" src="src/main.js"></script>

</body>
</html>
