<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ola Jin Myhre Nymoen</title>

  <link rel="stylesheet" href="css/main.css" />

  <!-- Preload carousel images so they start loading before JS runs -->
  <link rel="preload" as="image" href="images/shifted/01-ad6.jpg">
  <link rel="preload" as="image" href="images/shifted/11-ad6.jpg">
  <link rel="preload" as="image" href="images/womens-house/01-womens-house.jpg">
  <link rel="preload" as="image" href="images/womens-house/02-womens-house.jpg">
  <link rel="preload" as="image" href="images/lean-to/12-AD3-night-display.jpg">
  <link rel="preload" as="image" href="images/sagvaag-senior-garden/06-apt-sagvaag.jpg">
  <script>
    if (sessionStorage.getItem('fromProject') === '1') {
      document.documentElement.classList.add('from-project');
    }
    if (sessionStorage.getItem('introSeen') === '1') {
      document.documentElement.classList.add('intro-seen');
    }
  </script>
</head>

<body data-page="index">

  <!-- ================= HEADER ================= -->
  <header class="index-hero">
    <span></span>

    <button class="index-logo-btn" aria-label="Logo button">
      <img src="images/architecture-portfolio.svg" class="index-logo" alt="Logo" />
    </button>

    <button class="index-burger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  

  <!-- ================= MENU ================= -->
  <nav class="menu-overlay" id="menuOverlay">
    <button class="menu-close" id="menuClose">×</button>

    <span class="menu-label">Projects</span>

    <div id="menuLinks"></div>
  </nav>

  <!-- ================= CAROUSEL ================= -->
  <section class="carousel" id="carousel"></section>

  <!-- ================= TICKER ================= -->
  <div class="ticker">
    <div class="ticker-track">
      <span>Selected Works</span>
      <span>Selected Works</span>
    </div>
  </div>

  <!-- ================= GRID ================= -->
  <main class="index-projects" id="projectsGrid">
    <!-- JS lager cards her -->
  </main>

  <!-- ================= INTRO ================= -->
  <div class="intro-overlay" id="introOverlay"></div>
  <img src="images/architecture-portfolio.svg" class="intro-logo" id="introLogo" alt="" />

  <!-- ================= JS ================= -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
